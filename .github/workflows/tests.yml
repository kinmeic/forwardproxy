name: Tests
on:
  push:
    branches: [master, main, naive, codex/udp-over-quic]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ^1.26.x
      - name: Build and test with production Caddy patches
        run: ./scripts/build-udp-caddy.sh "$RUNNER_TEMP/udp-caddy"
