name: Go formatting
on:
  push:
    branches: [master, main, naive, codex/udp-over-quic]
    paths-ignore: ['**.md']
  pull_request:
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ^1.26.x
      - name: Check gofmt
        run: |
          files=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$files" ]; then printf '%s\n' "$files"; exit 1; fi
      - name: Check build script
        run: bash -n scripts/build-udp-caddy.sh
